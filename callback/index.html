<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add to Vibe</title>
<style>
body {
  background: #121212;
  color: white;
  font-family: Arial, sans-serif;
  display: grid;
  place-items: center;
  min-height: 90vh;
  text-align: center;
  padding: 20px;
}
main { max-width: 420px; }
h1 { color: #1ed760; }
button {
  background: #1ed760;
  color: black;
  border: none;
  border-radius: 30px;
  padding: 15px 25px;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}
#connect { display: none; }
</style>
</head>
<body>
<main>
<h1>Add to Vibe</h1>
<p id="status">Connecting...</p>
<button id="connect">Connect Spotify</button>
</main>

<script>
const CLIENT_ID = "dbbf837d370041bab5ff0d75f0942cb6";
const PLAYLIST_ID = "1KHvX9k3SZxDg5Shny1G0n";

const REDIRECT_URI =
"https://poloblocks.github.io/add-to-vibe/callback/";

const SCOPES = [
  "user-read-currently-playing",
  "playlist-modify-public",
  "playlist-modify-private"
].join(" ");

const status = document.getElementById("status");
const connectButton = document.getElementById("connect");

function message(text) {
  status.textContent = text;
}

function randomString(length) {
  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  const values = crypto.getRandomValues(
    new Uint8Array(length)
  );
  return Array.from(values, v => chars[v % chars.length]).join("");
}

function base64url(buffer) {
  return btoa(String.fromCharCode(...new Uint8Array(buffer)))
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}

async function createChallenge(verifier) {
  const data = new TextEncoder().encode(verifier);
  const hash = await crypto.subtle.digest("SHA-256", data);
  return base64url(hash);
}

async function login() {
  const verifier = randomString(64);
  const challenge = await createChallenge(verifier);
  const state = randomString(24);

  localStorage.setItem("spotify_verifier", verifier);
  localStorage.setItem("spotify_state", state);

  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    response_type: "code",
    redirect_uri: REDIRECT_URI,
    code_challenge_method: "S256",
    code_challenge: challenge,
    state: state,
    scope: SCOPES
  });

  window.location.href =
    "https://accounts.spotify.com/authorize?" + params;
}

async function exchangeCode(code) {
  const verifier = localStorage.getItem("spotify_verifier");
  const savedState = localStorage.getItem("spotify_state");
  const returnedState =
    new URLSearchParams(location.search).get("state");

  if (!verifier || !savedState || returnedState !== savedState) {
    throw new Error("Login verification failed. Please reconnect.");
  }

  const response = await fetch(
    "https://accounts.spotify.com/api/token",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: "authorization_code",
        code: code,
        redirect_uri: REDIRECT_URI,
        code_verifier: verifier
      })
    }
  );

  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.error_description || "Spotify login failed.");
  }

  saveTokens(data);

  localStorage.removeItem("spotify_verifier");
  localStorage.removeItem("spotify_state");

  history.replaceState({}, document.title, REDIRECT_URI);
}

function saveTokens(data) {
  localStorage.setItem("spotify_access", data.access_token);

  if (data.refresh_token) {
    localStorage.setItem("spotify_refresh", data.refresh_token);
  }

  localStorage.setItem(
    "spotify_expiry",
    String(Date.now() + data.expires_in * 1000)
  );
}

async function getToken() {
  const access = localStorage.getItem("spotify_access");
  const expiry = Number(localStorage.getItem("spotify_expiry"));

  if (access && Date.now() < expiry - 60000) {
    return access;
  }

  const refresh = localStorage.getItem("spotify_refresh");

  if (!refresh) return null;

  const response = await fetch(
    "https://accounts.spotify.com/api/token",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: "refresh_token",
        refresh_token: refresh
      })
    }
  );

  const data = await response.json();

  if (!response.ok) {
    localStorage.removeItem("spotify_access");
    localStorage.removeItem("spotify_refresh");
    return null;
  }

  saveTokens(data);
  return data.access_token;
}

async function addCurrentTrack(token) {
  message("Checking what's playing...");

  const response = await fetch(
    "https://api.spotify.com/v1/me/player/currently-playing",
    {
      headers: {
        Authorization: "Bearer " + token
      }
    }
  );

  if (response.status === 401) {
    throw new Error("Spotify session expired. Please reconnect.");
  }

  if (response.status === 204) {
    throw new Error("Nothing is currently playing on Spotify.");
  }

  if (!response.ok) {
    throw new Error("Couldn't detect your song. Spotify returned " + response.status);
  }

  const playback = await response.json();

  if (!playback.is_playing || !playback.item) {
    throw new Error("Start playing a song in Spotify first.");
  }

  if (playback.item.type !== "track" || !playback.item.uri) {
    throw new Error("The current item isn't a supported track.");
  }

  const track = playback.item;

  message("Adding " + track.name + "...");

  const addResponse = await fetch(
    "https://api.spotify.com/v1/playlists/" +
    PLAYLIST_ID + "/items",
    {
      method: "POST",
      headers: {
        Authorization: "Bearer " + token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        uris: [track.uri]
      })
    }
  );

  if (!addResponse.ok) {
    throw new Error("Couldn't add the song. Spotify returned " + addResponse.status);
  }

  const artists = track.artists.map(a => a.name).join(", ");

  message("Added " + track.name + " by " + artists + " to Vibe!");
}

async function start() {
  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  const error = params.get("error");

  if (error) {
    throw new Error("Spotify authorization was declined.");
  }

  if (code) {
    message("Finishing Spotify connection...");
    await exchangeCode(code);
  }

  let token = await getToken();

  if (!token) {
    message("Connect Spotify to get started.");
    connectButton.style.display = "inline-block";
    return;
  }

  await addCurrentTrack(token);
}

connectButton.addEventListener("click", login);

start().catch(error => {
  message(error.message);
  connectButton.style.display = "inline-block";
});
</script>
</body>
</html>
